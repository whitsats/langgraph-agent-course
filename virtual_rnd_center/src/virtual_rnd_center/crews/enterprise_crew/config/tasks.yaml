# ==================================================
# ENTERPRISE TASK SPECIFICATIONS v2.0
# ==================================================
# CHANGE LOG:
# - P0-1: Removed output_file from BA-owned tasks.
#   BA agents MUST use project_scaffolder to write files.
# - P1-1: All downstream tasks open with mandatory read_file_content.
#   Missing upstream files trigger fast-fail (BLOCKER), not silent fallback.
# - P2-2: Micro-batch rule on scaffolding task.
# ==================================================

ent_research_task:
  description: >
    Use '{user_input}' as the research subject.
    Read the template at 'templates/enterprise/research.tpl.md' if available.

    Conduct comprehensive market research including:
    - Competitor landscape analysis
    - Target user demographic analysis
    - Industry trend mapping
    - Revenue model options

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the research report.
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: research.md
    ```
    (your content here)
    ```expected_output: >
    Confirmation from project_scaffolder that 'research.md' was written successfully.
  agent: pm

ent_critique_task:
  description: >
    [MANDATORY FIRST STEP] Call 'read_file_content' to read
    '{project_path}/research.md'.
    If the file is missing, STOP and report: "BLOCKER: research.md not found."

    Red-team audit the research report. Identify:
    - Logical gaps and unsupported assumptions
    - Market sizing errors
    - Competitive risks that were underweighted

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the audit report.
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: research_audit.md
    ```
    (your content here)
    ```expected_output: >
    Confirmation from project_scaffolder that 'research_audit.md' was written.
  agent: nitpicker

ent_decision_gate:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read prerequisites.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/research.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'validate_checkpoint' on EXACTLY '{project_path}/research_audit.md' (Warning: DO NOT omit 'output/' prefix).
    3. Call 'read_file_content' on BOTH using their FULL paths.
    If either is missing or validation fails, STOP and report BLOCKER.

    Conduct a 3-5 turn binary interrogation in Chinese to confirm Enterprise scope.
    Ask ONE binary question per turn. Wait for the user's answer each time.

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the confirmed
    strategy manifest. Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: strategy_manifest.md
    ```
    (your content here)
    ```expected_output: >
    Confirmed Enterprise Strategy Manifest written via project_scaffolder.
  agent: ba

ent_prd_distill:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read strategy_manifest.md.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/strategy_manifest.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY '{project_path}/strategy_manifest.md'.
    If missing or validation fails, STOP and report BLOCKER.

    Read the template at 'templates/enterprise/prd.tpl.md' if available.
    Synthesize decisions into an Enterprise PRD in Chinese.

    TEMPLATE:
    # Enterprise Product Requirements Document
    ## 1. Business Logic Depth
    ## 2. Integration Constraints
    ## 3. Compliance & Security Standards
    ## 4. Out-of-Scope (verbatim from strategy_manifest.md)
    ## 5. BANNED IMPLEMENTATION KEYWORDS
    (Comma-separated list of class/function names FORBIDDEN in code)

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the PRD.
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: requirements.md
    ```
    (your content here)
    ```expected_output: >
    Confirmation that 'requirements.md' was written via project_scaffolder.
  agent: ba

