ent_scaffolding_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read prerequisites.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/requirements.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'validate_checkpoint' on EXACTLY '{project_path}/architecture_sad.md' (Warning: DO NOT omit 'output/' prefix).
    3. Call 'validate_checkpoint' on EXACTLY '{project_path}/implementation_plan.md' (Warning: DO NOT omit 'output/' prefix).
    4. Call 'read_file_content' on ALL THREE using their FULL paths.
    If any is missing or validation fails, STOP and report BLOCKER.

    [SCOPE ENFORCEMENT] Locate 'BANNED IMPLEMENTATION KEYWORDS' in requirements.md.
    NEVER write code containing those keywords.

    [MICRO-BATCH RULE] Call 'project_scaffolder' one batch at a time,
    max 5 files per call, keep files concise and modular (e.g. under 200 lines if possible).

    After all code is written, call 'scope_guard_validator' on your complete output.

    Also generate 'tech_specs.md':
    # [STEEL_CONTRACT] TECHNICAL SPECIFICATIONS
    ## 1. Infrastructure Matrix
    ## 2. Data Persistence Model (ONLY approved fields)
    ## 3. Internal API Contract
    ## 4. Bootstrap Command
    docker compose -f {project_path}/docker-compose.yml up -d --build
  expected_output: >
    All source files written via project_scaffolder. tech_specs.md confirmed.
    scope_guard_validator returned SCOPE_OK.
  agent: backend_dev

ent_integration_debug:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read tech_specs.md.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/tech_specs.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY '{project_path}/tech_specs.md'.
    If missing or validation fails, STOP and report BLOCKER.

    [DEPLOY] Call docker_mcp_controller with command='compose',
    args={'path': '{project_path}/docker-compose.yml', 'subcommand': 'up'}.
    COMPOSE ONLY. DO NOT use command='build' or command='run'.

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the deployment report.
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: deployment_report.md
    ```
    (your content here)
    ```TEMPLATE:
    # INFRASTRUCTURE DEPLOYMENT AUDIT
    ## 1. Deployment Metadata (Timestamp, Mode)
    ## 2. Container Health Status (table from docker ps)
    ## 3. Critical Log Analysis
    ## 4. Deployment Verdict: [PASSED / FAILED]
  expected_output: >
    Confirmation that 'deployment_report.md' was written. Verdict is PASSED or FAILED.
  agent: devops

ent_qa_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read prerequisites.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/tech_specs.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'validate_checkpoint' on EXACTLY '{project_path}/deployment_report.md' (Warning: DO NOT omit 'output/' prefix).
    3. Call 'read_file_content' on BOTH using their FULL paths.
    If either is missing or validation fails, STOP and report BLOCKER.

    Test all API endpoints. Execute via docker_mcp_controller exec. [QA TOOLING RULE] You MUST use 'curl' for testing endpoints (e.g., 'curl -s http://localhost:8000/api/...'). DO NOT write or execute python scripts/one-liners for testing.

    [MANDATORY LAST STEP] Write 'qa_report.md' via project_scaffolder.
    Then call docker_mcp_controller command='compose' subcommand='down' to clean up.

    TEMPLATE:
    # QUALITY ASSURANCE ACCEPTANCE REPORT
    ## 1. Test Environment Snapshot
    ## 2. Functional Verification Matrix
    | Case ID | Feature | Result | Notes |
    ## 3. Edge Case & Logic Audit
    ## 4. Final Sign-off: [APPROVED / REJECTED]
  expected_output: >
    Confirmation that 'qa_report.md' was written. Containers confirmed stopped.
  agent: qa_engineer

ent_code_nitpick_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read qa_report.md.
    1. Call 'validate_checkpoint' on EXACTLY '{project_path}/qa_report.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY '{project_path}/qa_report.md'.
    If missing or validation fails, STOP and report BLOCKER.

    Read all source code files via read_file_content.
    Run 'scope_guard_validator' on the complete codebase.
    Identify: code smells, security issues, performance bottlenecks,
    and any remaining scope drift.

    [MANDATORY LAST STEP] Write 'code_audit_final.md' via project_scaffolder.
  expected_output: >
    Confirmation that 'code_audit_final.md' was written. SCOPE_OK confirmed.
  agent: nitpicker
