# ==================================================
# MVP TASK SPECIFICATIONS v3.0 (Red-Blue Confrontation)
# ==================================================
# CHANGE LOG:
# - Added rework_scaffolding_task: dev receives QA error_context + round_num
# - Added rework_qa_task: QA explicitly references previous round findings
# - round_num injected from Flow state for tracking
# - Updated project_scaffolder usage instructions for Bulletproof parsing
# ==================================================

# -------------------------------------------------------
# FULL CYCLE TASKS (Round 1 only)
# -------------------------------------------------------

mvp_boundary_task:
  description: >
    [ROUND 1 — BA INTERVIEW]
    Use '{user_input}' as the raw product idea.
    Read 'templates/mvp/boundary.tpl.md' for the template.

    Conduct a 3-5 turn binary interview in Chinese.
    Ask ONE binary (Yes/No) question per turn. Wait for the answer.
    After confirmation, fill the boundary manifest template.

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write the manifest.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: boundary_manifest.md
    ```
    (your markdown content)
    ```

    [PROHIBITION] DO NOT call 'validate_checkpoint' or 'read_file_content' to verify the file after writing. Trust the project_scaffolder output and finish the task immediately.
  expected_output: >
    Confirmation from project_scaffolder that 'boundary_manifest.md' was written.
  agent: ba

mvp_requirements_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read the manifest.
    1. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/boundary_manifest.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY 'output/{project_subdir}/boundary_manifest.md'.
    If missing or validation fails, STOP and report BLOCKER.

    Read 'templates/mvp/prd.tpl.md' for the template.
    Synthesize a business PRD in Chinese, strictly following the template.

    The PRD MUST include a section:
    ## BANNED IMPLEMENTATION KEYWORDS
    (comma-separated list of class names / API patterns NOT to implement)

    [MANDATORY LAST STEP] Call 'project_scaffolder' to write 'requirements.md'.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: requirements.md
    ```
    (your markdown content)
    ```
  expected_output: >
    Confirmation from project_scaffolder that 'requirements.md' was written.
  agent: ba

mvp_scaffolding_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read requirements.
    1. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/requirements.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY 'output/{project_subdir}/requirements.md'.
    If missing or validation fails, STOP and report BLOCKER.

    [SCOPE ENFORCEMENT] Locate BANNED IMPLEMENTATION KEYWORDS in requirements.md.
    NEVER write code containing those keywords.

    [MICRO-BATCH RULE] Call 'project_scaffolder' one batch at a time.
    Max 5 files per call, keep files concise and modular (e.g. under 200 lines if possible).
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: tech_specs.md
    ```
    (code)
    ```
    ### FILE: backend/main.py
    ```
    (code)
    ```

    [ARCHITECTURE RULE] You MUST use a TWO-CONTAINER strategy (backend + frontend).
    DO NOT use a monolithic single-container approach.
    Also generate 'tech_specs.md' in the project root using 'templates/mvp/tech_specs.tpl.md'.
    You MUST strictly follow the template's port (8000/80) and healthcheck requirements.
    The docker-compose.yml MUST include a healthcheck for the backend service
    and 'condition: service_healthy' for the frontend depends_on.

    [STRICT TOOL PARAMETERS AND USAGE RULES]
    You have access to EXACTLY these three tools:
    1. 'validate_checkpoint' (CheckpointValidatorTool):
       - Use to verify the existence and size of files on disk.
       - Takes argument: 'file_path' (e.g. 'output/mvp_project/requirements.md').
    2. 'read_file_content' (FileReadTool):
       - Use ONLY to read existing files from the disk.
       - Takes arguments: 'file_path' (e.g. 'output/mvp_project/backend/main.py'), 'start_line', 'line_count'.
       - NEVER use 'project_scaffolder' to read files!
    3. 'project_scaffolder' (ProjectScaffolderTool):
       - Use ONLY to write, create, or modify files.
       - Takes arguments: 'project_root' (e.g. 'mvp_project') and 'file_data' (formatted string starting with '### FILE: ...').
       - NEVER use 'project_scaffolder' with 'file_path', 'start_line', or 'line_count' arguments! If you need to read a file, call 'read_file_content'.
       - NEVER write or create files using 'read_file_content' or any other tool.

    [PROHIBITION] DO NOT call 'scope_guard_validator' or any scope validation tools at the end of this task. Simply finish writing all project files and tech_specs.md and complete the task.
  expected_output: >
    All source files written via project_scaffolder. tech_specs.md in the root confirmed.
  agent: fullstack_dev

mvp_debug_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read tech specs.
    1. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/tech_specs.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'read_file_content' on EXACTLY 'output/{project_subdir}/tech_specs.md'.
    If missing or validation fails, STOP and report BLOCKER.

    [MANDATORY REVIEW CHECK]
    - Before initiating Docker Compose, you MUST call 'validate_checkpoint' on 'output/{project_subdir}/code_review_report.md' and read it via 'read_file_content'.
    - If the report contains 'Review Verdict: REJECTED', you MUST skip all actual deployment actions. Immediately write a deployment report stating "Deployment skipped because the codebase failed Review Audit." And strictly write 'Deployment Verdict: FAILED' at the end.

    [DEPLOY] Call 'docker_mcp_controller' with:
    command='compose', args={{'path': 'output/{project_subdir}/docker-compose.yml', 'subcommand': 'up'}}.
    COMPOSE ONLY. DO NOT use command='build' or command='run'.

    Read 'templates/mvp/deployment_report.tpl.md' for the report template.

    [MANDATORY LAST STEP] Write 'deployment_report.md' via project_scaffolder.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: deployment_report.md
    ```
    (your report)
    ```
    The report MUST end with one of:
    Deployment Verdict: PASSED
    Deployment Verdict: FAILED
  expected_output: >
    Confirmation that 'deployment_report.md' was written.
    Verdict line (PASSED or FAILED) present at end of report.
  agent: devops

mvp_qa_task:
  description: >
    [MANDATORY FIRST STEP] Confirm existence and read reports.
    1. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/tech_specs.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/deployment_report.md' (Warning: DO NOT omit 'output/' prefix).
    3. Call 'read_file_content' on BOTH using their FULL paths.
    If deployment_report.md shows FAILED, skip testing and write qa_report.md
    with Sign-off: REJECTED (reason: deployment not healthy).

    [MANDATORY REVIEW CHECK]
    - Before running API tests, you MUST call 'validate_checkpoint' on 'output/{project_subdir}/code_review_report.md' and read it via 'read_file_content'.
    - If the report contains 'Review Verdict: REJECTED', you MUST skip all actual testing. Immediately write qa_report.md stating "QA testing skipped because the codebase failed Review Audit." And strictly write 'QA Sign-off: REJECTED' at the end.

    [RED TEAM MANDATE] Your job is to BREAK the system, not to pass it.
    Test all endpoints. Probe edge cases. Try invalid inputs.
    Test the full user journey end-to-end.

    [PERFORMANCE / ITERATION OPTIMIZATION RULE]
    - To prevent hitting the max iterations limit, DO NOT invoke separate curl commands or python one-liners one-by-one.
    - Instead, write a single temporary Python test script (e.g. `test_suite.py`) inside the container containing all test assertions and urllib requests.
    - Execute it in a single shot using 'docker_mcp_controller' command='exec' with container='{project_subdir}-backend-1' and inner_cmd='python test_suite.py'.
    - Parse the console output of this script to easily write your acceptance report!

    Read 'templates/mvp/qa_report.tpl.md' for the report template.

    [MANDATORY LAST STEP] Write 'qa_report.md' via project_scaffolder.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: qa_report.md
    ```
    (your report)
    ```
    The report MUST end with one of:
    QA Sign-off: APPROVED
    QA Sign-off: REJECTED
  expected_output: >
    Confirmation that 'qa_report.md' was written.
    Sign-off line (APPROVED or REJECTED) present at end of report.
  agent: qa_engineer

mvp_review_task:
  description: >
    [ROUND 1 — SCOPE AUDIT]
    [MANDATORY FIRST STEP] Confirm existence and read all inputs:
    1. Call 'validate_checkpoint' on 'output/{project_subdir}/boundary_manifest.md'.
    2. Call 'validate_checkpoint' on 'output/{project_subdir}/requirements.md'.
    3. Read both files using 'read_file_content'.
    
    Read the newly generated source code files in the 'output/{project_subdir}/backend' 
    and 'frontend' folders (e.g. main.py, routes.py, database.py).

    Perform an intelligent red-team review:
    - Compare implemented features against BANNED FUNCTIONAL ENTITIES and SCOPE BOUNDARY restrictions.
    - Check if banned features (e.g., Friendship, Chat, Like) have functional endpoints, 
      database tables, or UI components.
    - Ignore harmless references in comments, explanations, or unrelated variable names.

    [MANDATORY LAST STEP] Write 'code_review_report.md' via project_scaffolder.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: code_review_report.md
    ```
    (your report)
    ```
    The report MUST contain:
    - Section "## 1. Scope Alignment Audit" (list each out-of-scope feature, verdict: CLEAN or VIOLATION).
    - Section "## 2. Actionable Feedback" (if rejected, give exact instructions on what to remove).
    - The final line MUST be exactly:
      Review Verdict: APPROVED
      or
      Review Verdict: REJECTED
  expected_output: >
    Confirmation that 'code_review_report.md' was written.
    Verdict line present at the end of the report.
  agent: code_reviewer

# -------------------------------------------------------
# REWORK TASKS (Round 2+ — skip BA, fix code based on QA feedback)
# -------------------------------------------------------

rework_scaffolding_task:
  description: >
    [REWORK ROUND #{round_num}]

    [MANDATORY FIRST STEP] Confirm existence and read prerequisites.
    1. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/requirements.md' (Warning: DO NOT omit 'output/' prefix).
    2. Call 'validate_checkpoint' on EXACTLY 'output/{project_subdir}/tech_specs.md' (Warning: DO NOT omit 'output/' prefix).
    3. Call 'read_file_content' on BOTH using their FULL paths.
    If either is missing or validation fails, STOP and report BLOCKER.

    [ARCHITECTURE RULE] You MUST use a TWO-CONTAINER strategy (backend + frontend).
    DO NOT use a monolithic single-container approach.
    The docker-compose.yml MUST use 'condition: service_healthy' for frontend depends_on.

    [QA FEEDBACK FROM PREVIOUS ROUND — MUST ADDRESS]:
    {error_context}

    [MICRO-BATCH RULE] Call 'project_scaffolder' one batch at a time.
    Read the existing source files to understand what was built.
    Fix ONLY the issues identified by QA. Do NOT add new features.

    [SCOPE ENFORCEMENT] Re-read BANNED IMPLEMENTATION KEYWORDS from requirements.md.
    NEVER introduce those keywords in the fix.

    [MICRO-BATCH RULE] Call 'project_scaffolder' one batch at a time.
    Max 5 files per call, keep files concise and modular (e.g. under 200 lines if possible).
    Use project_root='{project_subdir}'
    Use the file_data string format (In this specific tool, filenames MUST be relative to project_root, NO 'output/' or '{project_subdir}/' prefix):
    ### FILE: tech_specs.md
    ```
    (code)
    ```

    After all fixes are written, call 'scope_guard_validator' on changed files.
    Update 'tech_specs.md' if any ports, endpoints, or schemas changed.
  expected_output: >
    All fixed files written via project_scaffolder.
    scope_guard_validator returned SCOPE_OK.
    tech_specs.md updated if applicable.
  agent: fullstack_dev

rework_qa_task:
  description: >
    [REWORK ROUND #{round_num} — QA RE-ATTACK]

    [MANDATORY FIRST STEP] Call 'read_file_content' to read BOTH:
    1. 'output/{project_subdir}/tech_specs.md'
    2. 'output/{project_subdir}/deployment_report.md'

    [PREVIOUS ROUND ISSUES — VERIFY THESE ARE FIXED]:
    {error_context}

    [RED TEAM MANDATE] Do not be lenient. Specifically re-test all issues
    from the previous round. Also probe new potential regressions.

    Read 'templates/mvp/qa_report.tpl.md' for the report template.

    [MANDATORY LAST STEP] Write 'qa_report.md' via project_scaffolder.
    Use project_root='{project_subdir}', and for file_data use EXACTLY:
    ### FILE: qa_report.md
    ```
    (your report)
    ```
    The report MUST include:
    - Section: ## Previous Round Issues Verification
      (confirm each prior issue: FIXED / STILL_PRESENT)
    - Final line: QA Sign-off: APPROVED or QA Sign-off: REJECTED
  expected_output: >
    Confirmation that 'qa_report.md' was written.
    Previous-round issue verification section present.
    Sign-off line present.
  agent: qa_engineer
